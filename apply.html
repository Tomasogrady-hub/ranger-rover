<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Enrich LA - Garden Ranger Jobs</title>
<meta name="description" content="Apply to become an Enrich LA Garden Ranger - teach and grow school gardens across Los Angeles.">
<meta property="og:title" content="Become a Garden Ranger with Enrich LA">
<meta property="og:description" content="Teach hands-on garden lessons and care for school gardens across Los Angeles.">
<meta property="og:image" content="https://tomasogrady-hub.github.io/ranger-rover/icon-512.png">
<!-- apply.html v1.0 - 2026-10-31 - public job postings + Ranger application form (writes to Humans via GAS publicApply) -->
<style>
  :root{--grove:#1e3a1e;--leaf:#2f6b35;--orange:#E07A3F;--sun:#F2B33D;--fog:#f6f5f0;--ink:#25281f;--muted:#6b6f63;--line:#dedbd0;--err:#a3332b}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--fog);line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 64px}
  header{background:var(--grove);color:#fff;padding:22px 16px 26px}
  header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
  header img{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:var(--sun)}
  header .kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
  header h1{margin:2px 0 0;font-size:24px;line-height:1.2}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-top:-12px;box-shadow:0 2px 10px rgba(30,58,30,.06)}
  .card + .card{margin-top:16px}
  .facts{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 4px}
  .fact{display:flex;gap:10px;font-size:15px}
  .fact b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .fact .ic{font-size:18px;width:24px;text-align:center;flex-shrink:0}
  .desc h3{font-size:16px;margin:18px 0 6px;color:var(--grove)}
  .desc p{margin:0 0 10px}
  .desc ul{margin:0 0 10px;padding-left:20px}
  .desc li{margin:3px 0}
  .posted{font-size:13px;color:var(--muted)}
  .skel{height:14px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;margin:10px 0}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  h2{font-size:20px;margin:0 0 4px;color:var(--grove)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 6px}
  label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
  label .opt{font-weight:400;color:var(--muted)}
  label .req{color:var(--orange)}
  .hint{font-size:13px;color:var(--muted);margin:-2px 0 6px}
  input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:var(--orange)}
  textarea{min-height:120px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
  .row2 label,.row3 label{margin-top:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:15px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .chip.on{background:var(--grove);border-color:var(--grove);color:#fff}
  .file{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:#fcfcf9;font-size:15px}
  .file.has{border-style:solid;border-color:var(--leaf);background:#eef6ee;text-align:left}
  .file input{display:none}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  button.go{width:100%;margin-top:22px;padding:16px;border:none;border-radius:11px;background:var(--orange);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
  button.go:disabled{background:#b9b6aa;cursor:wait}
  .err{color:var(--err);font-size:14px;margin-top:12px;min-height:1em}
  .done{text-align:center;padding:30px 8px}
  .done .big{font-size:52px;line-height:1}
  .list a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;background:#fff}
  .list a:hover{border-color:var(--orange)}
  .list .t{font-weight:700;color:var(--grove);font-size:17px}
  .closed{background:#fff4e5;border-radius:10px;padding:12px 14px;font-weight:600}
  footer{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}
  footer img{height:30px;display:block;margin:0 auto 6px}
  @media(max-width:420px){.row3{grid-template-columns:1fr 1fr}.row3 .full{grid-column:1/-1}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="in">
  <img src="la-logo.png" alt="Enrich LA" width="52" height="52">
  <div><div class="kick">Enrich LA · Join our team</div><h1 id="hTitle">Become a Garden Ranger</h1></div>
</div></header>

<div class="wrap">
  <div class="card" id="posting">
    <div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:70%"></div>
  </div>

  <div class="card" id="formCard">
    <h2>Apply</h2>
    <p class="sub">Takes about 5 minutes. Fields marked <span style="color:var(--orange)">*</span> are required.</p>
    <form id="f" novalidate autocomplete="on">
      <div class="row2">
        <div><label for="firstName">First name <span class="req">*</span></label><input type="text" id="firstName" autocomplete="given-name" required></div>
        <div><label for="lastName">Last name <span class="req">*</span></label><input type="text" id="lastName" autocomplete="family-name" required></div>
      </div>
      <div class="row2">
        <div><label for="email">Email <span class="req">*</span></label><input type="email" id="email" autocomplete="email" inputmode="email" required></div>
        <div><label for="mobile">Mobile <span class="req">*</span></label><input type="tel" id="mobile" autocomplete="tel" inputmode="tel" placeholder="(323) 555-0123" required></div>
      </div>
      <label for="street">Street address <span class="opt">(optional)</span></label>
      <input type="text" id="street" autocomplete="street-address">
      <div class="row3">
        <div class="full"><label for="city">City</label><input type="text" id="city" autocomplete="address-level2"></div>
        <div><label for="state">State</label><input type="text" id="state" value="CA" autocomplete="address-level1"></div>
        <div><label for="zip">Zip</label><input type="text" id="zip" autocomplete="postal-code" inputmode="numeric"></div>
      </div>

      <label for="pitch">Tell us about yourself <span class="req">*</span></label>
      <div class="hint">Why do you want to be a Garden Ranger? What would you bring to our students?</div>
      <textarea id="pitch" required></textarea>

      <label for="experience">Gardening, teaching or kids experience <span class="opt">(optional)</span></label>
      <textarea id="experience" style="min-height:80px"></textarea>

      <label>Which weekdays could you work?</label>
      <div class="chips" id="days">
        <span class="chip" data-v="Mon">Mon</span><span class="chip" data-v="Tue">Tue</span><span class="chip" data-v="Wed">Wed</span><span class="chip" data-v="Thu">Thu</span><span class="chip" data-v="Fri">Fri</span>
      </div>
      <div class="row2">
        <div><label for="timeOfDay">Time of day</label>
          <select id="timeOfDay"><option value="">Choose…</option><option>Mornings</option><option>Afternoons</option><option>Mornings or afternoons</option><option>Full days</option></select></div>
        <div><label for="hasCar">Reliable transportation?</label>
          <select id="hasCar"><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select></div>
      </div>
      <label for="areas">Parts of LA you can travel to <span class="opt">(optional)</span></label>
      <input type="text" id="areas" placeholder="e.g. East LA, Valley, South Bay">
      <div class="row2">
        <div><label for="languages">Languages you speak</label><input type="text" id="languages" placeholder="English, Spanish…"></div>
        <div><label for="howHeard">How did you hear about us?</label>
          <select id="howHeard"><option value="">Choose…</option><option>Enrich LA website</option><option>Friend or current Ranger</option><option>Job board</option><option>Social media</option><option>School or teacher</option><option>Other</option></select></div>
      </div>

      <label>Resume <span class="opt">(optional - PDF, Word or photo, up to 6 MB)</span></label>
      <label class="file" id="fileBox" style="font-weight:400;margin-top:0">
        <input type="file" id="resume" accept=".pdf,.doc,.docx,.rtf,.txt,.odt,.pages,image/*,application/pdf">
        <span id="fileTxt">📎 Tap to attach your resume</span>
      </label>

      <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

      <button type="submit" class="go" id="go">Submit application</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>

  <footer><img src="enrich-logo.png" alt="Enrich LA" loading="lazy">Growing school gardens across Los Angeles</footer>
</div>

<script>
(function(){
  var FALLBACK_URL = 'https://script.google.com/macros/s/AKfycbzdqoCSOkvDYuEdMzZsEafBVegdCgEudbxPdqLXlH3DcHLHzUZHBLC-vPlhQ1oqfnYd/exec';
  var GAS_URL = FALLBACK_URL;
  try { GAS_URL = localStorage.getItem('rr_gas_url') || FALLBACK_URL; } catch(e){}
  var q = new URLSearchParams(location.search);
  var posId = (q.get('p') || '').trim();
  var position = null;
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function raw(url, action, extra){
    return fetch(url, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(Object.assign({action:action}, extra||{}))})
      .then(function(r){ return r.json(); });
  }
  // Resolve the live backend URL (old deployments keep running old code).
  var resolved = raw(GAS_URL, 'getAppSettings').then(function(r){
    if (r && r.gasUrl && r.gasUrl !== GAS_URL) {
      GAS_URL = r.gasUrl;
      try { localStorage.setItem('rr_gas_url', GAS_URL); } catch(e){}
      return true;
    }
    return false;
  }).catch(function(){ return false; });

  // Light formatting: "- " lines -> bullets, short lines before bullets -> headings.
  function fmt(t){
    var lines = String(t || '').replace(/\r/g,'').split('\n'), out = '', list = false;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].trim();
      var isB = /^[-•*]\s+/.test(l);
      if (isB) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + esc(l.replace(/^[-•*]\s+/, '')) + '</li>'; continue; }
      if (list) { out += '</ul>'; list = false; }
      if (!l) continue;
      var next = (lines[i+1] || '').trim();
      if (l.length < 60 && !/[.!?]$/.test(l) && /^[-•*]\s+/.test(next)) out += '<h3>' + esc(l) + '</h3>';
      else out += '<p>' + esc(l) + '</p>';
    }
    if (list) out += '</ul>';
    return out;
  }
  function fact(ic, label, val){ return val ? '<div class="fact"><span class="ic">' + ic + '</span><div><b>' + label + '</b>' + esc(val) + '</div></div>' : ''; }

  function showPosition(p){
    position = p;
    $('hTitle').textContent = p.title || 'Become a Garden Ranger';
    document.title = (p.title || 'Garden Ranger') + ' | Enrich LA';
    var html = '<h2>' + esc(p.title) + '</h2>' + (p.date ? '<div class="posted">Posted ' + esc(p.date) + '</div>' : '') +
      '<div class="facts">' + fact('📍','Where',p.location) + fact('🗓️','Schedule',p.schedule) + fact('💵','Pay',p.pay) + '</div>' +
      '<div class="desc">' + fmt(p.description) + (p.requirements ? '<h3>Requirements</h3><p>' + esc(p.requirements) + '</p>' : '') + '</div>';
    if (!p.open) {
      html += '<div class="closed">This posting is no longer accepting applications.</div>';
      $('formCard').style.display = 'none';
    }
    $('posting').innerHTML = html;
  }
  function showList(list){
    if (list.length === 1) { history.replaceState(null, '', '?p=' + encodeURIComponent(list[0].id)); return showPosition(list[0]); }
    if (!list.length) {
      $('posting').innerHTML = '<h2>Join our team</h2><p>We have no open postings right now, but we are always glad to hear from people who love gardens and kids. Send us a general application below.</p>';
      return;
    }
    $('posting').innerHTML = '<h2>Open positions</h2><div class="list">' + list.map(function(p){
      return '<a href="?p=' + encodeURIComponent(p.id) + '"><div class="t">' + esc(p.title) + '</div><div class="posted">' + esc([p.location, p.schedule].filter(Boolean).join(' · ')) + '</div></a>';
    }).join('') + '</div>';
    $('formCard').style.display = 'none';
  }
  function loadPostings(retried){
    return raw(GAS_URL, 'publicGetPositions', posId ? {id: posId} : {}).then(function(r){
      if (!r || !r.hr) throw new Error('stale');
      if (posId) {
        if (r.ok && r.position) showPosition(r.position);
        else { posId = ''; return loadPostings(true); }
      } else showList(r.positions || []);
    }).catch(function(){
      if (retried) { $('posting').innerHTML = '<h2>Become a Garden Ranger</h2><p>Teach hands-on garden lessons and help care for school gardens across Los Angeles.</p>'; return; }
      return resolved.then(function(){ return loadPostings(true); });
    });
  }
  loadPostings(false);

  // Day chips
  $('days').addEventListener('click', function(e){ var c = e.target.closest('.chip'); if (c) c.classList.toggle('on'); });

  // Resume
  var resumeFile = null;
  $('resume').addEventListener('change', function(){
    var f = this.files && this.files[0];
    $('err').textContent = '';
    if (f && f.size > 6 * 1024 * 1024) { $('err').textContent = 'That file is over 6 MB - please choose a smaller one.'; this.value = ''; f = null; }
    resumeFile = f || null;
    $('fileBox').classList.toggle('has', !!resumeFile);
    $('fileTxt').textContent = resumeFile ? '✅ ' + resumeFile.name + ' (' + Math.max(1, Math.round(resumeFile.size / 1024)) + ' KB) - tap to change' : '📎 Tap to attach your resume';
  });
  function readFile(f){
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onload = function(){ var s = String(r.result); res(s.slice(s.indexOf(',') + 1)); };
      r.onerror = function(){ rej(new Error('Could not read the file')); };
      r.readAsDataURL(f);
    });
  }

  function val(id){ return ($(id).value || '').trim(); }
  $('f').addEventListener('submit', function(e){
    e.preventDefault();
    var err = $('err'); err.textContent = '';
    var need = [['firstName','your first name'],['lastName','your last name'],['email','your email'],['mobile','your mobile number'],['pitch','a few sentences about yourself']];
    for (var i = 0; i < need.length; i++) {
      if (!val(need[i][0])) { err.textContent = 'Please add ' + need[i][1] + '.'; $(need[i][0]).focus(); return; }
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val('email'))) { err.textContent = 'Please check your email address.'; $('email').focus(); return; }
    if (val('mobile').replace(/\D/g,'').length < 10) { err.textContent = 'Please enter a 10-digit mobile number.'; $('mobile').focus(); return; }
    if (val('pitch').length < 20) { err.textContent = 'Please tell us a little more about yourself.'; $('pitch').focus(); return; }

    var btn = $('go'); btn.disabled = true; btn.textContent = resumeFile ? 'Uploading…' : 'Sending…';
    var payload = {
      positionId: position ? position.id : posId,
      firstName: val('firstName'), lastName: val('lastName'), email: val('email'), mobile: val('mobile'),
      street: val('street'), city: val('city'), state: val('state'), zip: val('zip'),
      pitch: val('pitch'), experience: val('experience'),
      availability: [].map.call(document.querySelectorAll('#days .chip.on'), function(c){ return c.dataset.v; }),
      timeOfDay: val('timeOfDay'), hasCar: val('hasCar'), areas: val('areas'),
      languages: val('languages'), howHeard: val('howHeard'), website: val('website')
    };
    (resumeFile ? readFile(resumeFile) : Promise.resolve(null)).then(function(b64){
      if (b64) payload.resume = { base64: b64, mimeType: resumeFile.type || '', fileName: resumeFile.name };
      return resolved;
    }).then(function(){
      return raw(GAS_URL, 'publicApply', payload);
    }).then(function(r){
      if (!r || !r.hr) throw new Error('Our application system is being updated - please try again in a few minutes.');
      if (!r.ok) throw new Error(r.error || 'Something went wrong.');
      $('formCard').innerHTML = '<div class="done"><div class="big">🌱</div><h2 style="margin-top:12px">Thank you, ' + esc(payload.firstName) + '!</h2>' +
        '<p>Your application is in. We sent a confirmation to <b>' + esc(payload.email) + '</b> and will be in touch soon about next steps.</p></div>';
      $('formCard').scrollIntoView({behavior:'smooth', block:'start'});
    }).catch(function(x){
      btn.disabled = false; btn.textContent = 'Submit application';
      err.textContent = (x && x.message && x.message !== 'Failed to fetch') ? x.message : 'Could not send - please check your connection and try again.';
    });
  });
})();
</script>
</body>
</html>
