<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<title>Jobs at Enrich LA</title>
<meta name="description" content="Join Enrich LA - teach and grow school gardens across Los Angeles.">
<meta property="og:title" content="Join the Enrich LA team">
<meta property="og:description" content="Teach hands-on garden lessons and care for school gardens across Los Angeles.">
<meta property="og:image" content="https://tomasogrady-hub.github.io/ranger-rover/icon-512.png">
<!-- job.html v2.6 - 2026-11-16 - videos autoplay muted + loop (sound button). v2.5 - 2026-11-16 - direct video player first, Drive player as fallback. v2.4 - 2026-11-16 - 'Open video' fallback link. v2.3 - 2026-11-16 - picture/video banner (2 top, 2 bottom), videos load only when tapped. v2.2 - 2026-11-16 - app fonts, white fluid page, larger logo, new caption. v2.1 - 2026-11-15 - plain logo header, up to 2 photos per posting. v2.0 - 2026-11-09 - ALL open job postings on one page; ?p=ID jumps to (and highlights) that posting. Apply buttons -> apply.html?p=ID -->
<style>
  :root{--grove:#1e3a1e;--leaf:#2f6b35;--orange:#E07A3F;--sun:#F2B33D;--fog:#f6f5f0;--ink:#25281f;--muted:#6b6f63;--line:#dedbd0}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#fff;line-height:1.6}
  .wrap{max-width:none;margin:0;padding:0 clamp(16px,5vw,96px) 60px}
  header{padding:26px 16px 14px;text-align:center}
  header .in{max-width:none;margin:0 auto}
  header img{height:64px;width:auto;max-width:90%;display:block;margin:0 auto}
  header .kick,header h1{display:none}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-top:12px;box-shadow:0 2px 10px rgba(30,58,30,.06)}
  .mrow{display:grid;gap:10px;margin:0 0 16px}
  .mrow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mrow.one{grid-template-columns:minmax(0,1fr)}
  .mrow.bot{margin:18px 0 6px}
  .mt{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#111}
  .mt img{width:100%;height:100%;object-fit:cover;display:block}
  .mt.vid img{object-fit:contain}
  .mt .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:none;background:rgba(0,0,0,.62);color:#fff;font-size:26px;cursor:pointer}
  .mt .alt{position:absolute;left:8px;bottom:8px;z-index:3;background:rgba(0,0,0,.7);color:#fff;font:12px sans-serif;padding:5px 9px;border-radius:12px;text-decoration:none}
  .mt .snd{position:absolute;right:8px;bottom:8px;z-index:3;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;padding:7px 9px;border-radius:16px;cursor:pointer}
  .mt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  @media(max-width:640px){.mrow.two{grid-template-columns:minmax(0,1fr)}}
  .ph{display:grid;gap:10px;margin:14px 0 4px}
  .ph.two{grid-template-columns:1fr 1fr}
  .ph img{width:100%;height:100%;max-height:300px;object-fit:cover;border-radius:10px;display:block;background:var(--fog)}
  @media(max-width:480px){.ph.two{grid-template-columns:1fr}}
  .card + .card{margin-top:16px}
  .post{scroll-margin-top:12px}
  .posted{font-size:13px;color:var(--muted)}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0 6px}
  .fact{display:flex;gap:10px;font-size:15px;background:var(--fog);border-radius:10px;padding:10px 12px}
  .fact b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .fact .ic{font-size:18px;width:22px;text-align:center;flex-shrink:0}
  h2{font-size:21px;margin:0 0 4px;color:var(--grove)}
  .sec h3{font-size:17px;margin:22px 0 6px;color:var(--grove)}
  .sec h4{font-size:15px;margin:14px 0 4px}
  .sec p{margin:0 0 10px}
  .sec ul{margin:0 0 10px;padding-left:20px}
  .sec li{margin:3px 0}
  .faq dt{font-weight:700;margin-top:12px}
  .faq dd{margin:2px 0 0}
  .skel{height:14px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;margin:10px 0}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  a.apply{display:block;text-align:center;text-decoration:none;margin-top:22px;padding:16px;border-radius:11px;background:var(--orange);color:#fff;font-size:17px;font-weight:700}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none}
  .bar a.apply{max-width:none;margin:0}
  .closed{background:#fff4e5;border-radius:10px;padding:12px 14px;font-weight:600;margin-top:16px}
  .list a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;background:#fff}
  .list a:hover{border-color:var(--orange)}
  .list .t{font-weight:700;color:var(--grove);font-size:17px}
  footer{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}
  footer img{height:30px;display:block;margin:0 auto 6px}

  /* v2.3 look: same fonts as the app, white page, fluid width */
  body{font-size:17px}
  h1,h2,.pos .t,.list .t{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600}
  h1{font-size:30px} h2{font-size:26px}
  header img{height:96px !important}
  @media(max-width:480px){header img{height:80px !important}}
  footer{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:21px;color:var(--grove);padding:8px 16px}
  footer .q{font-family:'Outfit',system-ui,sans-serif;font-style:normal;font-size:14px;color:var(--muted);margin-bottom:6px}
</style>
</head>
<body>
<header><div class="in">
  <img src="enrich-logo.png" alt="Enrich LA">
  <div><div class="kick">Enrich LA</div><h1 id="hTitle">Jobs at Enrich LA</h1></div>
</div></header>

<div class="wrap">
  <div class="card" id="main">
    <div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:70%"></div>
  </div>
  <footer>An organic regenerative garden in every Los Angeles schoolyard</footer>
</div>

<script>
(function(){
  var FALLBACK_URL = 'https://script.google.com/macros/s/AKfycbzdqoCSOkvDYuEdMzZsEafBVegdCgEudbxPdqLXlH3DcHLHzUZHBLC-vPlhQ1oqfnYd/exec';
  var GAS_URL = FALLBACK_URL;
  try { GAS_URL = localStorage.getItem('rr_gas_url') || FALLBACK_URL; } catch(e){}
  var posId = (new URLSearchParams(location.search).get('p') || '').trim();
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function raw(url, action, extra){
    return fetch(url, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(Object.assign({action:action}, extra||{}))})
      .then(function(r){ return r.json(); });
  }
  var resolved = raw(GAS_URL, 'getAppSettings').then(function(r){
    if (r && r.gasUrl && r.gasUrl !== GAS_URL) { GAS_URL = r.gasUrl; try { localStorage.setItem('rr_gas_url', GAS_URL); } catch(e){} }
  }).catch(function(){});

  // Plain text from the sheet -> light HTML: "- " lines = bullets, short lines before bullets = headings.
  function fmt(t){
    var lines = String(t || '').replace(/\r/g,'').split('\n'), out = '', list = false;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].trim();
      if (/^[-•*]\s+/.test(l)) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + esc(l.replace(/^[-•*]\s+/, '')) + '</li>'; continue; }
      if (list) { out += '</ul>'; list = false; }
      if (!l) continue;
      var next = (lines[i+1] || '').trim();
      if (l.length < 60 && !/[.!?:]$/.test(l) && /^[-•*]\s+/.test(next)) out += '<h4>' + esc(l) + '</h4>';
      else out += '<p>' + esc(l) + '</p>';
    }
    if (list) out += '</ul>';
    return out;
  }
  // FAQ: a line ending in "?" (or starting Q:) is a question; following lines are its answer.
  function fmtFaq(t){
    var lines = String(t || '').replace(/\r/g,'').split('\n'), out = '', open = false;
    lines.forEach(function(l){
      l = l.trim(); if (!l) return;
      if (/\?$/.test(l) || /^q[:.]\s*/i.test(l)) { out += '<dt>' + esc(l.replace(/^q[:.]\s*/i,'')) + '</dt>'; open = true; }
      else out += '<dd>' + esc(l.replace(/^a[:.]\s*/i,'')) + '</dd>';
    });
    return open ? '<dl class="faq">' + out + '</dl>' : fmt(t);
  }
  function fact(ic, label, val){ return val ? '<div class="fact"><span class="ic">' + ic + '</span><div><b>' + label + '</b>' + esc(val) + '</div></div>' : ''; }
  function sec(title, body){ return body ? '<h3>' + title + '</h3>' + body : ''; }

  // One posting as its own card (all postings live on this one page).
  function mediaTile(m){
    return m.type === 'video'
      ? '<div class="mt vid" data-src="' + esc(m.src) + '"><img src="' + esc(m.thumb) + '" alt="" loading="lazy"><button class="play" type="button" aria-label="Play video">&#9654;</button></div>'
      : '<div class="mt"><img src="' + esc(m.src) + '" alt="" loading="lazy"></div>';
  }
  function mediaRow(list, cls){
    return (list && list.length) ? '<div class="mrow ' + (list.length > 1 ? 'two' : 'one') + (cls ? ' ' + cls : '') + '">' + list.map(mediaTile).join('') + '</div>' : '';
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.mt.vid') : null;
    if (t && t.dataset.src && !t.querySelector('iframe') && !t.querySelector('video')) {
      var src = t.dataset.src, m = src.match(/\/d\/([^\/?]+)/), id = m ? m[1] : '';
      var view = src.replace('/preview', '/view');
      var alt = '<a class="alt" target="_blank" rel="noopener" href="' + view + '">Trouble playing? Open video</a>';
      var frame = function(){ t.innerHTML = '<iframe src="' + src + '" allow="autoplay; fullscreen" allowfullscreen></iframe>' + alt; };
      if (!id) { frame(); return; }
      // Direct player first (works for visitors without a Drive sign-in); Drive's own player if that fails.
      t.innerHTML = '<video controls autoplay playsinline preload="metadata" style="position:absolute;inset:0;width:100%;height:100%;background:#000" src="https://drive.usercontent.google.com/download?id=' + id + '&export=download"></video>';
      var v = t.querySelector('video'), done = false;
      v.addEventListener('error', function(){ if (!done) { done = true; frame(); } });
      setTimeout(function(){ if (!done && v.readyState < 2) { done = true; frame(); } }, 8000);
      v.addEventListener('loadeddata', function(){ done = true; });
    }
  });
  // Silent looping autoplay: each video starts by itself (muted, as phones require) once it scrolls near the screen.
  var _vio = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(en){ if (en.isIntersecting) { _vio.unobserve(en.target); startVid(en.target); } });
  }, { rootMargin: '300px' }) : null;
  function startVid(t){
    var m = (t.dataset.src || '').match(/\/d\/([^\/?]+)/);
    if (!m || t.querySelector('video') || t.querySelector('iframe')) return;
    var v = document.createElement('video');
    v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain';
    v.addEventListener('playing', function(){
      var i = t.querySelector('img'), b = t.querySelector('.play');
      if (i) i.style.visibility = 'hidden'; if (b) b.style.display = 'none';
      if (!t.querySelector('.snd')) {
        var s = document.createElement('button'); s.type = 'button'; s.className = 'snd'; s.textContent = '\uD83D\uDD07';
        s.setAttribute('aria-label', 'Sound on/off');
        s.onclick = function(ev){ ev.stopPropagation(); v.muted = !v.muted; s.textContent = v.muted ? '\uD83D\uDD07' : '\uD83D\uDD0A'; };
        t.appendChild(s);
      }
    });
    v.addEventListener('error', function(){ v.remove(); }); // falls back to tap-to-play
    v.src = 'https://drive.usercontent.google.com/download?id=' + m[1] + '&export=download';
    t.insertBefore(v, t.firstChild);
    var pr = v.play(); if (pr && pr.catch) pr.catch(function(){});
  }
  function scanVids(){ document.querySelectorAll('.mt.vid:not([data-seen])').forEach(function(t){ t.setAttribute('data-seen', '1'); if (_vio) _vio.observe(t); else startVid(t); }); }
  new MutationObserver(scanVids).observe(document.documentElement, { childList: true, subtree: true });
  function postingHtml(p, highlight){
    var applyUrl = p.formUrl || ('apply.html?p=' + encodeURIComponent(p.id));
    return '<div class="card post" id="' + esc(p.id) + '"' + (highlight ? ' style="outline:3px solid var(--sun)"' : '') + '>' +
      mediaRow(p.media && p.media.top) +
      '<h2>' + esc(p.title) + '</h2>' + (p.date ? '<div class="posted">Posted ' + esc(p.date) + '</div>' : '') +
      ((p.photos && p.photos.length) ? '<div class="ph' + (p.photos.length > 1 ? ' two' : '') + '">' + p.photos.map(function(u){ return '<img src="' + esc(u) + '" alt="" loading="lazy">'; }).join('') + '</div>' : '') +
      '<div class="facts">' + fact('📍','Where',p.location) + fact('🗓️','Schedule',p.schedule) + fact('⏰','When',p.when) + fact('💵','Pay',p.pay) + '</div>' +
      '<div class="sec">' + fmt(p.description) +
        sec('Requirements', fmt(p.requirements)) +
        sec('Questions & answers', p.faq ? fmtFaq(p.faq) : '') +
      '</div>' +
      mediaRow(p.media && p.media.bottom, 'bot') +
      (p.open ? '<a class="apply" href="' + esc(applyUrl) + '">Apply for ' + esc(p.title) + '</a>'
              : '<div class="closed">This posting is no longer accepting applications.</div>') +
    '</div>';
  }
  function showAll(list, asked, note){
    var shown = list.slice();
    // A closed posting someone linked to directly still shows (marked closed), first.
    if (asked && !shown.some(function(x){ return x.id === asked.id; })) shown.unshift(asked);
    var html = '';
    if (note) html += '<div class="card"><div class="closed" style="margin:0">' + esc(note) + '</div></div>';
    if (!shown.length) {
      html += '<div class="card"><h2>Join our team</h2><p>We have no open postings right now, but we are always glad to hear from people who love gardens and kids.</p><a class="apply" href="apply.html">Send a general application</a></div>';
    } else {
      if (shown.length > 1) {
        html += '<div class="card"><h2>Open positions</h2><div class="list">' + shown.map(function(p){
          return '<a href="#' + encodeURIComponent(p.id) + '"><div class="t">' + esc(p.title) + '</div><div class="posted">' + esc([p.location, p.schedule].filter(Boolean).join(' · ')) + '</div></a>';
        }).join('') + '</div></div>';
      }
      html += shown.map(function(p){ return postingHtml(p, asked && shown.length > 1 && p.id === asked.id); }).join('');
      html += '<div class="card" style="text-align:center"><p style="margin:0 0 4px">Not sure which one fits?</p><a href="apply.html" style="color:var(--leaf);font-weight:600">Send a general application</a></div>';
    }
    $('main').outerHTML = '<div id="main">' + html + '</div>';
    if (asked && shown.length > 1) {
      var el = document.getElementById(asked.id);
      if (el) setTimeout(function(){ el.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
    }
  }
  function load(retried){
    return raw(GAS_URL, 'publicGetPositions', posId ? {id: posId} : {}).then(function(r){
      if (!r || r.hr !== 2) throw new Error('stale');
      showAll(r.positions || [], r.position || null, (posId && !r.position) ? 'That posting could not be found - here is what is open now.' : '');
    }).catch(function(){
      if (retried) { $('main').innerHTML = '<h2>Join our team</h2><p>Teach hands-on garden lessons and help care for school gardens across Los Angeles.</p><a class="apply" href="apply.html' + (posId ? '?p=' + encodeURIComponent(posId) : '') + '">Apply</a>'; return; }
      return resolved.then(function(){ return load(true); });
    });
  }
  load(false);
})();
</script>
</body>
</html>
