# Deploys GAS_SCRIPT.gs to the Apps Script project and creates a NEW deployment.
# Runs when GAS_SCRIPT.gs changes on main, or by hand from the Actions tab.
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['GAS_SCRIPT.gs']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Sign in to Google (from the CLASPRC_JSON secret)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "CLASPRC_JSON secret is empty"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Pull the live project (keeps emergency.gs and appsscript.json)
        run: |
          mkdir -p gas_work && cd gas_work
          printf '{"scriptId":"1k8EQR70ilzg0eGqWp6Ti278cmw3LXsjqb0lYwDkswFwJNZWG9Yf1qUsU","rootDir":"."}' > .clasp.json
          clasp pull
          ls -la
          test -f "New Ranger Rover App.js" || test -f "New Ranger Rover App.gs" || { echo "Main file not found after pull"; exit 1; }
          echo "--- appsscript.json ---"
          cat appsscript.json

      - name: Replace the main file with GAS_SCRIPT.gs and push
        run: |
          cd gas_work
          rm -f "New Ranger Rover App.js" "New Ranger Rover App.gs"
          cp ../GAS_SCRIPT.gs "New Ranger Rover App.gs"
          grep -q '"webapp"' appsscript.json || { echo "appsscript.json has no webapp block; refusing to deploy"; exit 1; }
          clasp push --force
          clasp status

      - name: Make room - delete ONLY the oldest deployments (Google allows 20; keep newest 18)
        run: |
          cd gas_work
          clasp deployments | tee dep.txt
          grep -E 'AKfycb[A-Za-z0-9_-]+ +@[0-9]+' dep.txt \
            | sed -E 's/^.*(AKfycb[A-Za-z0-9_-]+) +@([0-9]+).*$/\2 \1/' | sort -n > vers.txt || true
          N=$(wc -l < vers.txt)
          echo "Versioned deployments: $N"
          if [ "$N" -ge 19 ]; then
            DEL=$((N-18))
            echo "Deleting the $DEL oldest:"
            head -n "$DEL" vers.txt | while read -r v d; do echo "  version $v $d"; clasp undeploy "$d"; done
          fi

      - name: Create a new deployment
        id: deploy
        run: |
          cd gas_work
          DESC="Auto ${GITHUB_SHA::7} $(date -u +%Y-%m-%d_%H:%M)"
          clasp deploy --description "$DESC" | tee deploy.log
          ID=$(grep -oE 'AKfycb[A-Za-z0-9_-]+' deploy.log | head -n1)
          test -n "$ID" || { echo "Could not read the new deployment id"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "New web app URL: https://script.google.com/macros/s/$ID/exec"
          echo "## New deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "https://script.google.com/macros/s/$ID/exec" >> "$GITHUB_STEP_SUMMARY"

      - name: Point the app and public pages at the new URL, then publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="https://script.google.com/macros/s/${{ steps.deploy.outputs.id }}/exec"
          case "$NEW" in https://script.google.com/macros/s/AKfycb*/exec) ;; *) echo "Unexpected URL: $NEW"; exit 1;; esac
          sed -i -E "s#https://script\.google\.com/macros/s/AKfycb[A-Za-z0-9_-]+/exec#${NEW}#g" ./*.html
          sed -i -E "s#(const CACHE_NAME = 'ranger-rover-v[0-9]+-[0-9]+)[^']*'#\1-a${GITHUB_SHA::7}'#" sw.js
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -- ./*.html sw.js
          if git diff --cached --quiet; then echo "No URL changes to commit"; exit 0; fi
          git commit -m "Auto: point app at new Apps Script deployment"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" -f ref=main
          echo "## App now uses" >> "$GITHUB_STEP_SUMMARY"
          echo "$NEW" >> "$GITHUB_STEP_SUMMARY"
