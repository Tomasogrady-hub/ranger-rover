<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Contact - Enrich LA</title>
<meta name="description" content="Get in touch with Enrich LA - school gardens across Los Angeles.">
<!-- contact.html v1.0 - 2026-11-24 - public contact form for the Wix site (embed with an iframe or link here). Sends to Ranger Rover > Reach > Incoming. -->
<style>
  :root{--grove:#1e3a1e;--leaf:#2f6b35;--orange:#E07A3F;--fog:#f6f5f0;--ink:#25281f;--muted:#6b6f63;--line:#dedbd0;--err:#a3332b}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;color:var(--ink);background:#fff;line-height:1.55}
  .wrap{max-width:720px;margin:0 auto;padding:0 clamp(16px,5vw,40px) 56px}
  header{padding:26px 16px 10px;text-align:center}
  header img{height:72px;width:auto;max-width:90%;display:block;margin:0 auto}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:32px;color:var(--grove);text-align:center;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:16px;text-align:center;margin:0 0 8px}
  label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
  label .opt{font-weight:400;color:var(--muted)}
  input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);border-color:var(--orange)}
  textarea{min-height:150px;resize:vertical}
  .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  button.go{width:100%;margin-top:22px;padding:16px;border:none;border-radius:11px;background:var(--orange);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
  button.go:disabled{background:#b9b6aa;cursor:wait}
  .err{color:var(--err);font-size:14px;margin-top:12px;min-height:1em}
  .done{text-align:center;padding:36px 8px}
  .done .big{font-size:56px;line-height:1}
  .done h2{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:30px;color:var(--grove);margin:8px 0}
  footer{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><img src="enrich-logo.png" alt="Enrich LA"></header>
<div class="wrap">
  <div id="formBox">
    <h1>Get in touch</h1>
    <p class="sub">Questions about school gardens, our Ranger program, or working together? Send us a note and we will get back to you.</p>
    <form id="f" novalidate>
      <div class="row2">
        <div><label for="name">Your name</label><input type="text" id="name" autocomplete="name" required></div>
        <div><label for="email">Email</label><input type="email" id="email" autocomplete="email" required></div>
      </div>
      <div class="row2">
        <div><label for="phone">Phone <span class="opt">(optional)</span></label><input type="tel" id="phone" autocomplete="tel"></div>
        <div><label for="role">I am a…</label>
          <select id="role"><option value="">Choose…</option><option>School principal or staff</option><option>Parent or PTA member</option><option>Teacher</option><option>Volunteer</option><option>Community organization</option><option>Press</option><option>Other</option></select></div>
      </div>
      <label for="org">School or organization <span class="opt">(optional)</span></label>
      <input type="text" id="org" autocomplete="organization">
      <label for="message">Message</label>
      <textarea id="message" required></textarea>
      <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
      <button type="submit" class="go" id="go">Send message</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
  <div id="doneBox" class="done" style="display:none"><div class="big">🌱</div><h2>Thank you!</h2><div>Your message reached the Enrich LA team. We will be in touch soon.</div></div>
  <footer>An organic regenerative garden in every Los Angeles schoolyard</footer>
</div>
<script>
(function(){
  var FALLBACK_URL = 'https://script.google.com/macros/s/AKfycbyADLMAqbRWNveEWt176EQh9BQ7I2GBtKLLOqj8AwVSDWc6-BpAQRbiTLSZQT7QP3Hd/exec';
  var GAS_URL = FALLBACK_URL;
  var $ = function(id){ return document.getElementById(id); };
  function raw(url, action, extra){
    return fetch(url, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(Object.assign({action:action}, extra||{}))}).then(function(r){ return r.json(); });
  }
  // Ask the live deployment where the newest backend is (old deployments keep old code)
  var resolved = raw(GAS_URL, 'getAppSettings').then(function(r){
    if (r && r.gasUrl && r.gasUrl !== GAS_URL) GAS_URL = r.gasUrl;
  }).catch(function(){});
  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var err = $('err'); err.textContent = '';
    var data = { name:$('name').value.trim(), email:$('email').value.trim(), phone:$('phone').value.trim(), role:$('role').value, org:$('org').value.trim(), message:$('message').value.trim(), website:$('website').value };
    if (!data.name) { err.textContent = 'Please enter your name.'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) { err.textContent = 'Please enter a valid email address.'; return; }
    if (data.message.length < 5) { err.textContent = 'Please write a short message.'; return; }
    var b = $('go'); b.disabled = true; b.textContent = 'Sending…';
    resolved.then(function(){
      return raw(GAS_URL, 'publicContact', data).catch(function(){ return raw(FALLBACK_URL, 'publicContact', data); });
    }).then(function(r){
      if (r && r.ok) { $('formBox').style.display = 'none'; $('doneBox').style.display = 'block'; try { window.parent.postMessage('enrichla-contact-sent', '*'); } catch(e){} window.scrollTo(0,0); }
      else { err.textContent = (r && r.error) || 'Something went wrong - please try again.'; b.disabled = false; b.textContent = 'Send message'; }
    }).catch(function(){ err.textContent = 'Connection problem - please try again.'; b.disabled = false; b.textContent = 'Send message'; });
  });
})();
</script>
</body>
</html>
